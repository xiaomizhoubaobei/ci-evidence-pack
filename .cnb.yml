$:
  vscode:
    - docker:
        image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
      imports:
        - https://cnb.cool/XMZZUZHI/key/-/blob/main/Claude.yml
      runner:
        cpus: 64
      services:
        - vscode
        - docker
      stages:
        - name: 授予install_gpg_keys.sh权限
          script:
            - chmod +x /workspace/install_gpg_keys.sh

        - name: 安装claude CLI
          script:
            - npm install -g @anthropic-ai/claude-code
            - echo "claude CLI安装完成"

        # 白名单动作：取 CC_SETTINGS_URL → 保存为项目级 .claude/settings.local.json
        - name: 同步 cc 项目级设置（仅白名单用户）
          if: |
            if [ "$CNB_BUILD_USER" != "qixiaoxin" ]; then
              echo "不是白名单用户：${CNB_BUILD_USER}，跳过当前步骤，后续步骤继续执行"
              exit 1
            fi
            echo "白名单用户：${CNB_BUILD_USER}（事件：${CNB_EVENT}）"
            exit 0
          script: |
            PROJECT_ROOT="${PROJECT_ROOT:-/workspace}"
            TARGET_DIR="$PROJECT_ROOT/.claude"
            TARGET_FILE="$TARGET_DIR/settings.local.json"

            URL="${CC_SETTINGS_URL:-}"
            if [ -z "$URL" ]; then
              echo "CC_SETTINGS_URL 未配置，不保存 settings.local.json，后续 stage 继续"
              exit 0
            fi

            mkdir -p "$TARGET_DIR"
            if ! curl -fsSL "$URL" -o "$TARGET_FILE"; then
              echo "cc 设置下载失败，跳过本步骤内容，后续 stage 继续"
              rm -f "$TARGET_FILE"
              exit 0
            fi

            # 校验合法 JSON(此时 claude CLI 已装，node 可用)
            if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[process.argv.length-1],'utf8'))" "$TARGET_FILE"; then
              echo "下载内容不是合法 JSON，已丢弃，后续 stage 继续"
              rm -f "$TARGET_FILE"
              exit 0
            fi
            echo "已保存 cc 项目级设置：$TARGET_FILE"

        - name: 安装qwen CLI
          script:
            - npm install -g @qwen-code/qwen-code@latest
            - echo "qwen CLI安装完成"
        - name: 安装CodeBuddy CLI
          script:
            - npm install -g @tencent-ai/codebuddy-code
            - echo "CodeBuddy CLI安装完成"
        - name: 安装Qoder CLI
          script:
            - curl -fsSL https://qoder.com/install | bash
            - echo "Qoder CLI安装完成"
        - name: 安装sudo更新APT源
          script:
            - sudo apt-get update
            - sudo apt-get install -y lsof net-tools jq
            - echo "依赖完成"
        - name: 安装Git LFS
          script:
            - sudo apt-get install -y git-lfs
            - git lfs install
            - echo "Git LFS安装完成"
main:
  # PR 门禁：单测不过不允许合并。
  # 注意：还需要在仓库「分支保护 / main」里把这条流水线设为必需检查，
  # 否则它只是 PR 上的一个状态，不会真正拦住合并。
  pull_request:
    - name: 单元测试
      runner:
        cpus: 1
      docker:
        # 全量镜像自带 git / bash：测试夹具要建临时仓库，slim 镜像没装 git。
        image: python:3.13
      env:
        # 与 CLAUDE.md 的本地命令保持一致；editable 安装只是拿到 pytest/PyYAML。
        PYTHONPATH: src
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      stages:
        - name: 校验 Python 版本
          script: |
            python3 -V
            python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 13) else 1)'
        - name: 安装测试依赖
          script: |
            python3 -m pip install --quiet --root-user-action=ignore -e ".[dev]"
        - name: 运行单元测试
          script: |
            python3 -m pytest -q
  push:
    - services:
        - docker
      imports:
        - https://cnb.cool/XMZZUZHI/key/-/blob/main/Github.yml
      stages:
        - name: 同步到GitHub
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/xiaomizhoubaobei/ci-evidence-pack.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            branch: main
            # 强制覆盖镜像：目标仓库以 CNB 侧为准，分叉时用 --force 覆盖
            # （对应 git-sync 的 PLUGIN_FORCE）
            force: true
            git_user: ${GIT_USERNAME}
            git_email: ${GIT_EMAIL}
